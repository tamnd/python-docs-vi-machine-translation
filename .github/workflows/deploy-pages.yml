name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout CPython
        uses: actions/checkout@v4
        with:
          # The last commit on the 3.15 branch before this corpus was extracted,
          # which is what the POT-Creation-Date of 2026-05-08 18:34+0000 in every
          # catalog header refers to. It has to be that tree and not a later one,
          # because a msgid is only a key: an entry whose English moved by one
          # comma since the extraction stops matching and Sphinx quietly renders
          # the English instead. There is no error and no warning, the page just
          # comes out less translated than the coverage table says it is.
          #
          # This was pinned to a 3.14 backport until August 2026, so the site was
          # rendering the 3.14 documentation from 3.15 msgids and losing every
          # string that changed between the two. The step below is there so that
          # cannot happen again without the build going red.
          repository: python/cpython
          ref: "0bdbc4810165bcbaefd16560d48e94a472557d23"
          path: cpython

      - name: Set up CPython Doc venv
        run: make -C cpython/Doc/ venv

      - name: Checkout translation
        uses: actions/checkout@v4
        with:
          path: cpython/Doc/locales/vi/LC_MESSAGES

      - name: the catalogs and the checkout are the same Python
        run: |
          # Both sides say which version they are, and until this step existed
          # nothing compared them. The catalogs carry Project-Id-Version, written
          # by the extraction; CPython carries its own version in patchlevel.h.
          # Disagreement here is not a build failure of any kind, which is
          # precisely the problem: it produces a site that looks finished and is
          # missing whatever the two releases worded differently.
          catalogs=$(sed -n 's/^"Project-Id-Version: Python \([0-9.]*\)\\n"$/\1/p' \
            cpython/Doc/locales/vi/LC_MESSAGES/bugs.po | head -1)
          major=$(sed -n 's/^#define PY_MAJOR_VERSION *\([0-9]*\).*/\1/p' cpython/Include/patchlevel.h)
          minor=$(sed -n 's/^#define PY_MINOR_VERSION *\([0-9]*\).*/\1/p' cpython/Include/patchlevel.h)
          checkout="$major.$minor"
          echo "catalogs say Python $catalogs, the checkout is Python $checkout"
          if [ -z "$catalogs" ]; then
            echo "::error::no Project-Id-Version in bugs.po, so there is nothing to compare"
            exit 1
          fi
          if [ "$catalogs" != "$checkout" ]; then
            echo "::error::the catalogs are Python $catalogs and this builds Python $checkout, so every string the two releases word differently will render in English"
            exit 1
          fi

      - name: Build HTML
        run: |
          make -C cpython/Doc/ \
            JOBS=auto \
            SPHINXOPTS="--color -D language='vi'" \
            SPHINXERRORHANDLING="" \
            html

      - name: the built pages are actually in Vietnamese
        run: |
          # The gate this build was missing. Sphinx treats an unreadable catalog
          # as a warning and carries on, so a corpus that no tool can parse
          # produces a green build, a complete site, and not one word of
          # Vietnamese. That is not a hypothetical: an ISO 8601 PO-Revision-Date
          # made Babel raise on all 548 catalogs at once, Sphinx skipped every
          # .mo, and the published site lost all 1 437 reviewed strings with
          # nothing anywhere reporting it.
          #
          # Reads the rendered HTML rather than the .po files or the .mo files,
          # because every layer above the browser was happy while this was
          # broken. The only claim worth checking is the one a reader can see.
          python3 - <<'PY'
          import gettext, pathlib, sys

          root = pathlib.Path("cpython/Doc")
          wrong = []
          checked = 0
          # One page per tier 1 area. Tier 1 is where the reviewed translations
          # are, so if anything at all is rendered it is these.
          for doc in ("bugs", "tutorial/appetite", "library/functions"):
              mo = root / "locales/vi/LC_MESSAGES" / f"{doc}.mo"
              if not mo.exists():
                  wrong.append(f"{doc}: no .mo was written, so the catalog did not parse")
                  continue
              with mo.open("rb") as handle:
                  catalog = gettext.GNUTranslations(handle)._catalog
              want = [v for k, v in catalog.items() if isinstance(k, str) and k and v]
              if not want:
                  # Every string on the page could be fuzzy, which is normal for
                  # a page nobody has reviewed. Not an error, but it proves
                  # nothing either, so it does not count towards the check.
                  print(f"{doc}: nothing unfuzzy to look for, skipped")
                  continue
              checked += 1
              page = (root / "build/html" / f"{doc}.html").read_text("utf-8")
              found = sum(1 for one in want if one in page)
              print(f"{doc}: {found} of {len(want)} translations reached the page")
              if not found:
                  wrong.append(f"{doc}: none of its {len(want)} translations reached the page")

          if not checked and not wrong:
              wrong.append("no tier 1 page had an unfuzzy string, so nothing here was verified")
          for one in wrong:
              print(f"::error::{one}")
          sys.exit(1 if wrong else 0)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cpython/Doc/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
