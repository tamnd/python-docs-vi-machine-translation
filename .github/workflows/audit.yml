name: audit

# Runs the deterministic checks from python-docs-vi-translator over the catalogs
# in this repository. No model is ever called here, no key is ever needed, and
# the fleet is never touched. Everything below is reproducible from the
# committed .po files, the pin and the glossary, which is what makes a green run
# mean something and what makes it take under a minute.
#
# Three gates, and they do not all block yet. See the comments on each.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: read the pin, and say where everything lives
        id: pin
        run: |
          test -f .pydocvi-version || { echo "no .pydocvi-version"; exit 1; }
          test -f manifests/upstream.yaml || { echo "no manifests/upstream.yaml"; exit 1; }
          {
            echo "tool=$(cat .pydocvi-version)"
            echo "repo=$(awk '/^repo:/ {print $2}' manifests/upstream.yaml)"
            echo "commit=$(awk '/^commit:/ {print $2}' manifests/upstream.yaml)"
          } >> "$GITHUB_OUTPUT"
          # Set here rather than in a top-level env block, because the runner
          # context does not exist that early and a workflow that names it there
          # does not start at all.
          #
          # The mirror goes outside the workspace, and that is not tidiness. The
          # first run of this workflow cloned it to .upstream inside the
          # checkout, which is what PYDOCVI_CONTENT points at, so the walk found
          # 548 mirror catalogs and counted them as ours. The coverage table grew
          # a tier 0 of 87 008 entries and every total doubled. A nested checkout
          # is part of the corpus unless it is somewhere the corpus cannot be.
          {
            echo "PYDOCVI_UPSTREAM=$RUNNER_TEMP/upstream"
            echo "PYDOCVI_CONTENT=$GITHUB_WORKSPACE"
            echo "PYDOCVI_WORK=$RUNNER_TEMP/work"
          } >> "$GITHUB_ENV"

      - name: the upstream mirror at the pinned commit
        run: |
          # A shallow fetch of one commit, which is about 11 MB. Cloning the
          # branch would get whatever the hourly Transifex writer pushed this
          # morning, and then S01 would be comparing the corpus against a pin
          # that no longer describes what it just fetched.
          git init -q "$PYDOCVI_UPSTREAM"
          git -C "$PYDOCVI_UPSTREAM" remote add origin \
            "https://github.com/${{ steps.pin.outputs.repo }}.git"
          git -C "$PYDOCVI_UPSTREAM" fetch -q --depth 1 origin \
            "${{ steps.pin.outputs.commit }}"
          git -C "$PYDOCVI_UPSTREAM" checkout -q FETCH_HEAD

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install the pinned tool
        run: |
          # From git rather than PyPI until trusted publishing is set up, which
          # is issue #6 on the translator repo and needs a person. The tag is
          # what .pydocvi-version holds, so the pin still says one thing.
          uv tool install --quiet \
            "python-docs-vi-translator @ git+https://github.com/tamnd/python-docs-vi-translator@${{ steps.pin.outputs.tool }}"
          pydocvi version

      - name: audit
        id: audit
        # Still not blocking, and the reason has changed. Before apply wrote the
        # corpus this failed thirteen hard checks on about three thousand
        # findings, nearly all of them structural. That pass cleared the whole
        # structure group: S04 and S08 pass, A01 passes, and the total went from
        # 6 563 findings to 1 270.
        #
        # What is left is nine hard checks and 156 findings, and they are real
        # translation defects rather than formatting: 27 protected spans that did
        # not survive, 27 role targets that got translated, 47 whitespace
        # mismatches, 31 code entries that came back edited, 10 entries that are
        # the English verbatim and 9 that are not in Vietnamese. Every one of
        # those needs a person or a retranslation, not a tool change, so this
        # flips to blocking when that count reaches zero and not before. A gate
        # that has been red since the day it was added is not a gate.
        continue-on-error: true
        run: |
          pydocvi audit --report reports/audit.md | tee "$RUNNER_TEMP/audit.txt"

      - name: regenerate the reports
        run: |
          pydocvi report coverage
          pydocvi report quality

      - name: the reports match the corpus
        # This one blocks, from today. It is the gate that stops a pull request
        # landing a catalog change without regenerating the numbers, which is
        # the failure that turns a coverage table into a confident claim about a
        # corpus that is not there any more.
        run: |
          if ! git diff --exit-code -- README.md reports/; then
            echo "::error::the reports are stale, run: pydocvi report coverage && pydocvi report quality"
            exit 1
          fi
          echo "the committed reports are what the corpus produces"

      - name: apply --check
        # Blocking, from this commit. All 548 files differed until apply wrote
        # them, because the committed catalogs came from the old scripts/mt.py
        # and disagreed with the memory on their headers and their wrapping. They
        # now agree byte for byte, and the run that proved it used no flags: the
        # --refuzzy pass that re-marked the 241 entries that script left unmarked
        # was needed once, and a plain apply --check has been identical ever
        # since. So this gate can be held to the strict reading, which is that
        # nobody can hand-edit a catalog without the memory that explains it.
        run: pydocvi apply --check

      - name: summary
        if: always()
        run: |
          {
            echo "## Audit"
            echo
            echo "Tool \`${{ steps.pin.outputs.tool }}\`, upstream \`${{ steps.pin.outputs.commit }}\`."
            echo
            echo '```'
            tail -n 25 "$RUNNER_TEMP/audit.txt" 2>/dev/null || echo "the audit did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit
          path: reports/
          if-no-files-found: warn
